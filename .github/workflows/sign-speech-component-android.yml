name: Pocket TTS Android native component

# Hosted component compilation only; no app, device, signing, or release operation.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/sign-speech-component-android.yml
      - native/scripts/speech-component-android-policy.test.mjs
      - native/scripts/ci-sdk.sh
      - native/scripts/build-pocket-runtime.sh
      - native/scripts/check-pocket-elf.py
      - native/vendor/pocket-tts-runtime/**
      - native/android/app/src/main/cpp/pocket/**

permissions:
  contents: read

concurrency:
  group: sign-speech-component-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component:
    if: >-
      github.repository == 'Hatsunama/sign-to-speak' &&
      github.event.repository.private == false &&
      ((github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/codex/native-recognition-flow-20261024' ||
         github.ref == 'refs/heads/codex/sign-to-speak-qwen-pilot-20261118')) ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'Hatsunama/sign-to-speak' &&
        github.event.pull_request.head.ref == 'codex/native-recognition-flow-20261024'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # upstream v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify source, committed lock, and hosted tools
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test -s native/vendor/pocket-tts-runtime/Cargo.lock || { echo '::error::Committed Cargo.lock required; bootstrap is not admitted.'; exit 1; }
          for tool in rustup python3 node cmake sha256sum; do command -v "$tool"; done
          mkdir -p "$RUNNER_TEMP/pocket-android-evidence"
          printf '%s\n' "$EXPECTED_SOURCE_SHA" > "$RUNNER_TEMP/pocket-android-evidence/tested-sha.txt"
          sha256sum native/vendor/pocket-tts-runtime/Cargo.toml native/vendor/pocket-tts-runtime/Cargo.lock native/vendor/pocket-tts-runtime/build.rs native/vendor/pocket-tts-runtime/include/sign_pocket_tts.h native/vendor/pocket-tts-runtime/src/*.rs native/android/app/src/main/cpp/pocket/CMakeLists.txt native/android/app/src/main/cpp/pocket/pocket_jni.cpp native/android/app/src/main/cpp/pocket/exports.map native/scripts/ci-sdk.sh native/scripts/build-pocket-runtime.sh native/scripts/check-pocket-elf.py .github/workflows/sign-speech-component-android.yml > "$RUNNER_TEMP/pocket-android-evidence/source-sha256.txt"
      - name: Select pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # upstream v4
        with:
          node-version: '24.19.0'
          check-latest: false
      - name: Run workflow policy tests
        timeout-minutes: 2
        run: |
          set -euo pipefail
          cd native
          npm ci --ignore-scripts --no-audit --no-fund
          node --test scripts/speech-component-android-policy.test.mjs
      - name: Verify pinned Android SDK and NDK without accepting licenses
        timeout-minutes: 4
        run: bash native/scripts/ci-sdk.sh
      - name: Cross compile actual Android ARM64 C ABI library
        timeout-minutes: 22
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          ndk="$sdk/ndk/27.1.12297006"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cmake="$sdk/cmake/3.31.5/bin/cmake"
          evidence="$RUNNER_TEMP/pocket-android-evidence"
          runtime=native/vendor/pocket-tts-runtime
          wrapper="$RUNNER_TEMP/pocket-arm64-v8a.toolchain.cmake"
          receipt="$RUNNER_TEMP/pocket-arm64-v8a-toolchain.txt"
          test -x "$bin/llvm-readelf"
          test -x "$bin/llvm-nm"
          test -x "$cmake"
          "$bin/llvm-readelf" --version | sed -n '1p' > "$evidence/ndk-readelf-version.txt"
          "$cmake" --version | sed -n '1p' > "$evidence/cmake-version.txt"
          printf 'ndk=27.1.12297006\napi=29\nabi=arm64-v8a\nrunner-image=%s\nrun=%s\nattempt=%s\n' "${ImageVersion:-unknown}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$evidence/build-environment.txt"
          (cd "$runtime" && sha256sum Cargo.lock) > "$evidence/cargo-lock-sha256.txt"

          # Retain the compiler receipt while preserving an earlier build failure.
          retain_compiler_receipt() {
            local status=$1
            local copy_status=0
            if [[ -s "$receipt" ]]; then
              cp "$receipt" "$evidence/" || copy_status=$?
            fi
            if (( copy_status != 0 )); then
              printf '::error::Failed to retain compiler receipt (copy exit %s).\n' "$copy_status" >&2
              if (( status == 0 )); then
                status=$copy_status
              fi
            fi
            exit "$status"
          }
          trap 'retain_compiler_receipt "$?"' EXIT
          bash native/scripts/build-pocket-runtime.sh arm64-v8a
          test -s "$RUNNER_TEMP/pocket-arm64-v8a-metadata.json"
          test -s "$wrapper"
          grep '^rustc ' "$receipt" > "$evidence/rust-version.txt"
          grep '^cargo ' "$receipt" > "$evidence/cargo-version.txt"
          sha256sum "$ndk/source.properties" "$wrapper" > "$evidence/toolchain-sha256.txt"
          # The standalone JNI configure uses the same toolchain wrapper as the Rust build.
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "CMAKE_TOOLCHAIN_FILE=$wrapper"
            echo "CMAKE=$cmake"
          } >> "$GITHUB_ENV"

          cd "$runtime"
          sha256sum --check "$evidence/cargo-lock-sha256.txt"
          so=target/aarch64-linux-android/release/libsign_pocket_tts_runtime.so
          test -s "$so"
          sha256sum "$so" > "$evidence/component-sha256.txt"
      - name: Audit ARM64 ELF, 16 KiB segments, dependencies, and C ABI exports
        timeout-minutes: 2
        working-directory: native/vendor/pocket-tts-runtime
        run: |
          set -euo pipefail
          so=target/aarch64-linux-android/release/libsign_pocket_tts_runtime.so
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          evidence="$RUNNER_TEMP/pocket-android-evidence"
          "$bin/llvm-readelf" -hW "$so" > "$evidence/elf-header.txt"
          "$bin/llvm-readelf" -lW "$so" > "$evidence/elf-program-headers.txt"
          "$bin/llvm-readelf" -dW "$so" > "$evidence/elf-dynamic.txt"
          "$bin/llvm-nm" -D --defined-only "$so" > "$evidence/elf-exports.txt"
          python3 - "$evidence" <<'PY'
          from pathlib import Path
          import re, sys
          root = Path(sys.argv[1])
          header = (root / 'elf-header.txt').read_text()
          segments = (root / 'elf-program-headers.txt').read_text()
          dynamic = (root / 'elf-dynamic.txt').read_text()
          exports = (root / 'elf-exports.txt').read_text()
          if not re.search(r'Machine:\s*AArch64', header) or not re.search(r'Type:\s*DYN', header):
              raise SystemExit('Expected ARM64 shared object')
          loads = [line.split() for line in segments.splitlines() if line.lstrip().startswith('LOAD ')]
          if not loads:
              raise SystemExit('Missing ELF LOAD segments')
          for parts in loads:
              offset, vaddr, align = (int(parts[i], 16) for i in (1, 2, -1))
              if align < 16384 or offset % 16384 != vaddr % 16384:
                  raise SystemExit(f'Non-16-KiB-compatible LOAD: {parts}')
          needed = set(re.findall(r'\(NEEDED\).*?\[([^]]+)\]', dynamic))
          allowed = {'libc.so', 'libm.so', 'libdl.so', 'liblog.so', 'libc++_shared.so'}
          if not needed or not needed <= allowed:
              raise SystemExit(f'Unexpected NEEDED libraries: {sorted(needed)}')
          soname = re.findall(r'\(SONAME\).*?\[([^]]+)\]', dynamic)
          if soname != ['libsign_pocket_tts_runtime.so']:
              raise SystemExit(f'Unexpected Rust runtime DT_SONAME: {soname}')
          if re.search(r'\((?:RPATH|RUNPATH)\)', dynamic):
              raise SystemExit('RPATH/RUNPATH forbidden in Rust runtime')
          symbols = {line.split()[-1] for line in exports.splitlines() if line.split()}
          expected = {'sts_pocket_create', 'sts_pocket_synthesize', 'sts_pocket_cancel', 'sts_pocket_close'}
          if not expected <= symbols:
              raise SystemExit(f'Missing C ABI exports: {sorted(expected - symbols)}')
          (root / 'elf-audit.txt').write_text(f'abi=arm64-v8a\nload_segments={len(loads)}\nsoname={soname[0]}\nneeded={sorted(needed)}\nrequired_exports={sorted(expected)}\n16k_alignment=pass\n')
          PY
      - name: Cross compile and audit actual Android JNI bridge linkage
        timeout-minutes: 3
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/native/android/app/src/main/cpp/pocket"
          runtime="$GITHUB_WORKSPACE/native/vendor/pocket-tts-runtime/target/aarch64-linux-android/release/libsign_pocket_tts_runtime.so"
          build="$RUNNER_TEMP/pocket-android-jni-build"
          evidence="$RUNNER_TEMP/pocket-android-evidence"
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -s "$runtime"
          "$CMAKE" -S "$source_dir" -B "$build" \
            -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE" \
            -DPOCKET_RUNTIME_LIBRARY="$runtime" \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee "$evidence/jni-cmake-configure.txt"
          "$CMAKE" --build "$build" --target private_pocket_tts --parallel 2 2>&1 | tee "$evidence/jni-cmake-build.txt"
          so="$build/libprivate_pocket_tts.so"
          test -s "$so"
          sha256sum "$so" > "$evidence/jni-component-sha256.txt"
          "$bin/llvm-readelf" -hW "$so" > "$evidence/jni-elf-header.txt"
          "$bin/llvm-readelf" -lW "$so" > "$evidence/jni-elf-program-headers.txt"
          "$bin/llvm-readelf" -dW "$so" > "$evidence/jni-elf-dynamic.txt"
          "$bin/llvm-nm" -D --defined-only "$so" > "$evidence/jni-elf-exports.txt"
          python3 - "$evidence" <<'PY'
          from pathlib import Path
          import re, sys
          root = Path(sys.argv[1])
          header = (root / 'jni-elf-header.txt').read_text()
          segments = (root / 'jni-elf-program-headers.txt').read_text()
          dynamic = (root / 'jni-elf-dynamic.txt').read_text()
          exports = (root / 'jni-elf-exports.txt').read_text()
          failures = []
          if not re.search(r'Machine:\s*AArch64', header) or not re.search(r'Type:\s*DYN', header):
              failures.append('Expected ARM64 shared object')
          loads = [line.split() for line in segments.splitlines() if line.lstrip().startswith('LOAD ')]
          if not loads:
              failures.append('Missing ELF LOAD segments')
          for parts in loads:
              offset, vaddr, align = (int(parts[i], 16) for i in (1, 2, -1))
              if align < 16384 or offset % 16384 != vaddr % 16384:
                  failures.append(f'Non-16-KiB-compatible LOAD: {parts}')
          needed = re.findall(r'\(NEEDED\).*?\[([^]]+)\]', dynamic)
          runtime = 'libsign_pocket_tts_runtime.so'
          allowed = {runtime, 'libc.so', 'libm.so', 'libdl.so', 'liblog.so', 'libc++_shared.so'}
          if runtime not in needed:
              failures.append(f'Missing exact Rust runtime DT_NEEDED: {runtime}')
          if any('/' in name or '\\' in name or name not in allowed for name in needed):
              failures.append(f'Unexpected or path-bearing DT_NEEDED: {needed}')
          if re.search(r'\((?:RPATH|RUNPATH)\)', dynamic):
              failures.append('RPATH/RUNPATH forbidden in Android JNI bridge')
          symbols = {line.split()[-1] for line in exports.splitlines() if line.split()}
          expected = {'Java_com_xmilo_1at_1your_1side_sign_1to_1speak_PocketTtsRequest_native' + suffix
                      for suffix in ('Create', 'Synthesize', 'Cancel', 'Close')}
          if symbols != expected:
              failures.append(f'JNI exports differ: missing={sorted(expected - symbols)}, extra={sorted(symbols - expected)}')
          summary = (f'abi=arm64-v8a\nload_segments={len(loads)}\nneeded={needed}\n'
                     f'exports={sorted(symbols)}\n16k_alignment={"fail" if any("16-KiB" in x for x in failures) else "pass"}\n'
                     f'result={"fail" if failures else "pass"}\n' + '\n'.join(failures) + '\n')
          (root / 'jni-elf-audit.txt').write_text(summary)
          if failures:
              raise SystemExit('; '.join(failures))
          PY
      - name: Retain source and ELF audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # upstream v4
        with:
          name: pocket-android-component-evidence-${{ env.EXPECTED_SOURCE_SHA }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/pocket-android-evidence/*.txt
