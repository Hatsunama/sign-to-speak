name: Sign Android development checks

# Only the reviewed same-repository candidate branch or a manual dispatch. No publishing.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - native/**
      - .github/workflows/sign-android.yml

permissions:
  contents: read

concurrency:
  group: sign-android-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'fix/android-native-foundation')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: native
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - name: Checkout exact candidate head commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # upstream v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # upstream v4
        with:
          node-version: '24.19.0'
      - name: Record exact tested source and use preinstalled JDK 21
        run: |
          set -euo pipefail
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/sign-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/sign-evidence/tested-sha.txt"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          printf 'run=%s\nattempt=%s\nrunner-image=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "${ImageVersion:-unknown}" > "$RUNNER_TEMP/sign-evidence/run.txt"
          sha256sum package-lock.json android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.properties > "$RUNNER_TEMP/sign-evidence/source-checksums.txt"
      - name: Install locked JavaScript dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Full host suite, TypeScript and workflow policy
        id: host
        run: |
          set -euo pipefail
          npm test
          npm run typecheck
          sh tests/run-java-tests.sh
          node --test scripts/ci-policy.test.mjs scripts/ci-sdk.test.mjs
          python3 scripts/check-isolation-baseline.test.py
      - name: Verify Android prerequisites without accepting new licenses
        id: sdk
        run: bash scripts/ci-sdk.sh
      - name: Prove cleanup-isolation fail-before assertions and restore exact candidate
        id: baseline
        if: ${{ !cancelled() && steps.host.outcome == 'success' && steps.sdk.outcome == 'success' }}
        timeout-minutes: 12
        run: bash scripts/ci-isolation-baseline.sh
      - name: Compile actual Kotlin and run full Android unit suite (Robolectric, no emulator)
        if: ${{ !cancelled() && steps.host.outcome == 'success' && steps.sdk.outcome == 'success' && steps.baseline.outputs.restored == 'true' }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon --max-workers=2 --console=plain --stacktrace \
            -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=768m' \
            -Pandroid.builder.sdkDownload=false -PreactNativeArchitectures=x86_64 \
            :app:testDebugUnitTest
      - name: Verify debug and release merged permissions
        if: ${{ !cancelled() && steps.host.outcome == 'success' && steps.sdk.outcome == 'success' && steps.baseline.outputs.restored == 'true' }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew --continue --no-daemon --max-workers=2 --console=plain --stacktrace \
            -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=768m' \
            -Pandroid.builder.sdkDownload=false -PreactNativeArchitectures=x86_64 \
            :app:verifyDebugMergedPermissions :app:verifyReleaseMergedPermissions
      - name: Assemble unsigned development APK only
        if: ${{ !cancelled() && steps.host.outcome == 'success' && steps.sdk.outcome == 'success' && steps.baseline.outputs.restored == 'true' }}
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon --max-workers=2 --console=plain --stacktrace \
            -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=768m' \
            -Pandroid.builder.sdkDownload=false -PreactNativeArchitectures=x86_64 \
            :app:assembleDebug
          find app/build/outputs/apk/debug -name '*.apk' -exec sha256sum {} + > "$RUNNER_TEMP/sign-evidence/apk-checksums.txt"
          test -s "$RUNNER_TEMP/sign-evidence/apk-checksums.txt"
      - name: Retain bounded test evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # upstream v4
        with:
          name: sign-android-evidence-${{ env.TESTED_SHA }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/sign-evidence/
            native/android/app/build/reports/tests/
            native/android/app/build/test-results/
            native/android/app/build/outputs/logs/manifest-merger-*-report.txt
      - name: Retain successful unsigned APK (not installable, not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # upstream v4
        with:
          name: sign-android-unsigned-x86_64-${{ env.TESTED_SHA }}
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          path: native/android/app/build/outputs/apk/debug/*.apk
