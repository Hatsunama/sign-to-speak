name: Sign Qwen Android OpenCL smoke build

"on":
  workflow_dispatch:
  push:
    branches:
      - 'codex/sign-to-speak-qwen-pilot-20261118'
    paths:
      - '.github/workflows/sign-qwen-opencl-smoke.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NDK_VERSION: '27.3.13750724'
      ANDROID_API: '28'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      LLAMA_COMMIT: b1b770d90d94cad9e9ea5b993bdbc383a522fb28
      OPENCL_HEADERS_COMMIT: 8a97ebc88daa3495d6f57ec10bb515224400186f
      OPENCL_LOADER_COMMIT: ad770a1b64c6b8d5f2ed4e153f22e4f45939f27f
    steps:
      - name: Check out workflow repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check out llama.cpp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_COMMIT }}
          path: llama.cpp
          persist-credentials: false

      - name: Check out Khronos OpenCL headers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: KhronosGroup/OpenCL-Headers
          ref: ${{ env.OPENCL_HEADERS_COMMIT }}
          path: opencl-headers
          persist-credentials: false

      - name: Check out Khronos OpenCL ICD loader
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: KhronosGroup/OpenCL-ICD-Loader
          ref: ${{ env.OPENCL_LOADER_COMMIT }}
          path: opencl-icd-loader
          persist-credentials: false

      - name: Build, inspect and package the Android OpenCL QA tools
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          diagnostics="$RUNNER_TEMP/sign-qwen-opencl-diagnostics"
          mkdir -p "$diagnostics"
          manifest="$diagnostics/BUILD.txt"
          package="$(mktemp -d "$RUNNER_TEMP/sign-qwen-opencl-package.XXXXXX")"
          opencl_stage="$(mktemp -d "$RUNNER_TEMP/sign-qwen-opencl-link.XXXXXX")"
          build_dir="$RUNNER_TEMP/sign-qwen-opencl-build"
          qa_source=native/research/qwen_pilot/runtime_qa
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          toolchain="$ndk/build/cmake/android.toolchain.cmake"
          ndk_llvm="$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          opencl_include="$opencl_stage/include"
          opencl_library="$opencl_stage/lib/libOpenCL.so"
          readelf="$ndk_llvm/bin/llvm-readelf"

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C llama.cpp rev-parse HEAD)" = "$LLAMA_COMMIT"
          test "$(git -C opencl-headers rev-parse HEAD)" = "$OPENCL_HEADERS_COMMIT"
          test "$(git -C opencl-icd-loader rev-parse HEAD)" = "$OPENCL_LOADER_COMMIT"
          test -f "$toolchain"
          test "$(awk -F ' = ' '/^Pkg\.Revision / { print $2 }' "$ndk/source.properties")" = "$NDK_VERSION"
          mkdir -p "$opencl_include"
          cp -R opencl-headers/CL "$opencl_include/"
          test -s "$opencl_include/CL/cl.h"

          {
            printf 'scope=Android OpenCL multimodal CLI and logit probe\n'
            printf 'android_targets=llama-mtmd-cli qwen-backend-probe test-backend-ops\n'
            printf 'workflow_source=%s\nworkflow_commit=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'workflow_run=%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'llama_source=https://github.com/ggml-org/llama.cpp\nllama_tag=v1.0.0\nllama_commit=%s\n' "$LLAMA_COMMIT"
            printf 'opencl_headers_source=https://github.com/KhronosGroup/OpenCL-Headers\nopencl_headers_tag=v2025.07.22\nopencl_headers_commit=%s\n' "$OPENCL_HEADERS_COMMIT"
            printf 'opencl_loader_source=https://github.com/KhronosGroup/OpenCL-ICD-Loader\nopencl_loader_tag=v2025.07.22\nopencl_loader_commit=%s\n' "$OPENCL_LOADER_COMMIT"
            printf 'opencl_runtime_dependency=device-provided libOpenCL.so\n'
            printf 'runner=%s %s\nandroid_ndk=%s\nandroid_abi=arm64-v8a\nandroid_api=%s\nandroid_stl=c++_static\n' "$ImageOS" "$ImageVersion" "$NDK_VERSION" "$ANDROID_API"
            cmake --version
            ninja --version
            python3 --version
            "$ndk_llvm/bin/clang++" --version
            sha256sum "$toolchain" "$ndk/source.properties"
            printf '\nQA source SHA-256\n'
            sha256sum "$qa_source"/{CMakeLists.txt,qwen_backend_probe.cpp,README.md}
            printf '\nStaged OpenCL header tree SHA-256 (sorted relative paths and file hashes)\n'
            (
              cd "$opencl_include"
              find CL -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum
            )
            printf '\nBuild commands\n'
          } > "$manifest"

          run_build_command() {
            local phase="$1" status=0
            shift
            { printf '%q ' "$@"; printf '\n'; } >> "$manifest"
            "$@" 2>"$diagnostics/$phase.stderr.log" | tee "$diagnostics/$phase.stdout.log" || status=$?
            cat "$diagnostics/$phase.stderr.log" >&2
            return "$status"
          }

          android_options=(
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_SKIP_RPATH=ON
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH="$toolchain" -DANDROID_ABI=arm64-v8a
            -DANDROID_PLATFORM="android-$ANDROID_API" -DANDROID_STL=c++_static
          )

          # Cross-build Khronos' loader for the linker. Stage it separately from
          # the package so Android resolves the OEM library at runtime.
          run_build_command loader-configure cmake -S opencl-icd-loader -B "$opencl_stage/build" \
            "${android_options[@]}" -DOPENCL_ICD_LOADER_HEADERS_DIR:PATH="$opencl_include" \
            -DOPENCL_ICD_LOADER_BUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF \
            -DENABLE_OPENCL_LAYERS=OFF -DCMAKE_PLATFORM_NO_VERSIONED_SONAME:BOOL=ON \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY:PATH="$opencl_stage/lib"
          run_build_command loader-build cmake --build "$opencl_stage/build" --target OpenCL --parallel 2
          test -s "$opencl_library"
          loader_machine="$("$readelf" -hW "$opencl_library" | grep -E 'Machine: +AArch64$')"
          loader_soname="$("$readelf" -dW "$opencl_library" | awk '$2 == "(SONAME)" { gsub(/[][]/, "", $NF); print $NF }')"
          test "$loader_soname" = libOpenCL.so
          {
            printf '\nLink-time loader evidence\n%s\nsoname=%s\n' "$loader_machine" "$loader_soname"
            (cd "$opencl_stage" && sha256sum lib/libOpenCL.so)
          } >> "$manifest"

          options=(
            -DBUILD_SHARED_LIBS=OFF
            -DCMAKE_C_FLAGS='-ffunction-sections -fdata-sections'
            -DCMAKE_CXX_FLAGS='-ffunction-sections -fdata-sections'
            -DLLAMA_BUILD_IS_DEV=OFF -DLLAMA_BUILD_COMMON=ON -DLLAMA_BUILD_TOOLS=ON
            -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_APP=OFF
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_CONNECT=OFF
            -DLLAMA_OPENSSL=OFF -DLLAMA_SUBPROCESS=OFF
            -DMTMD_VIDEO=OFF -DGGML_NATIVE=OFF -DGGML_CPU=ON
            -DGGML_BACKEND_DL=OFF -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF
            -DGGML_BLAS=OFF -DGGML_CPU_KLEIDIAI=OFF -DGGML_RPC=OFF
            -DGGML_CUDA=OFF -DGGML_HIP=OFF -DGGML_METAL=OFF -DGGML_VULKAN=OFF
            -DGGML_OPENCL=ON -DGGML_WEBGPU=OFF -DGGML_SYCL=OFF -DGGML_HEXAGON=OFF
            -DGGML_CANN=OFF -DGGML_ET=OFF -DGGML_MUSA=OFF -DGGML_VIRTGPU=OFF
            -DGGML_VIRTGPU_BACKEND=OFF -DGGML_ZDNN=OFF -DGGML_ZENDNN=OFF -DGGML_OPENVINO=OFF
            -DGGML_OPENCL_EMBED_KERNELS=ON -DGGML_OPENCL_USE_ADRENO_KERNELS=ON
            -DGGML_OPENCL_USE_ADRENO_BIN_KERNELS=OFF
          )

          run_build_command runtime-configure cmake -S "$qa_source" -B "$build_dir" \
            "${android_options[@]}" "${options[@]}" -DLLAMA_SOURCE_DIR:PATH="$PWD/llama.cpp" \
            -DCMAKE_EXE_LINKER_FLAGS='-Wl,--gc-sections,-z,max-page-size=16384,-z,common-page-size=16384' \
            -DOpenCL_INCLUDE_DIR:PATH="$opencl_include" -DOpenCL_LIBRARY:FILEPATH="$opencl_library"

          cache="$build_dir/CMakeCache.txt"
          grep -Fx \
            -e "LLAMA_SOURCE_DIR:PATH=$PWD/llama.cpp" \
            -e "CMAKE_TOOLCHAIN_FILE:FILEPATH=$toolchain" \
            -e "OpenCL_INCLUDE_DIR:PATH=$opencl_include" \
            -e "OpenCL_LIBRARY:FILEPATH=$opencl_library" "$cache" > "$diagnostics/runtime-cache-paths.log"
          test "$(wc -l < "$diagnostics/runtime-cache-paths.log")" -eq 4
          for setting in GGML_OPENCL=ON GGML_CPU=ON GGML_VULKAN=OFF GGML_RPC=OFF \
                         GGML_OPENCL_EMBED_KERNELS=ON GGML_OPENCL_USE_ADRENO_KERNELS=ON \
                         GGML_OPENCL_USE_ADRENO_BIN_KERNELS=OFF LLAMA_BUILD_SERVER=OFF \
                         LLAMA_CONNECT=OFF LLAMA_OPENSSL=OFF LLAMA_BUILD_TESTS=ON; do
            grep -Fx "${setting%=*}:BOOL=${setting#*=}" "$cache"
          done

          run_build_command runtime-build cmake --build "$build_dir" \
            --target llama-mtmd-cli qwen-backend-probe --parallel 2

          run_build_command backend-ops-build cmake --build "$build_dir" --target test-backend-ops --parallel 2

          for target in llama-mtmd-cli qwen-backend-probe test-backend-ops; do
            android="$package/android-arm64-v8a/$target"
            install -Dm755 "$build_dir/bin/$target" "$android"
            "$readelf" -hW -dW -lW --dyn-syms --version-info "$android" > "$diagnostics/$target.readelf.log"
            machine="$("$readelf" -hW "$android" | grep -E 'Machine: +AArch64$')"
            dynamic="$("$readelf" -dW "$android")"
            dependencies="$(awk '$2 == "(NEEDED)" { gsub(/[][]/, "", $NF); print $NF }' <<< "$dynamic")"
            grep -Fx 'libOpenCL.so' <<< "$dependencies"
            if grep -Ev '^(lib(c|m|dl|log|android)\.so|libOpenCL\.so)$' <<< "$dependencies"; then
              printf 'Unexpected shared library in %s\n' "$target" >&2
              exit 1
            fi
            if grep -E '\((RPATH|RUNPATH)\)' <<< "$dynamic"; then
              printf 'Unexpected runtime library path in %s\n' "$target" >&2
              exit 1
            fi
            symbols="$("$readelf" --dyn-syms -W "$android")"
            if grep -E ' UND +listen(@|[[:space:]]|$)' <<< "$symbols"; then
              printf 'Unexpected listen import in %s\n' "$target" >&2
              exit 1
            fi
            opencl_imports="$(awk '$7 == "UND" && $8 ~ /^cl[A-Z]/ { print $8 }' <<< "$symbols")"
            test -n "$opencl_imports"
            alignments="$("$readelf" -lW "$android" | awk '$1 == "LOAD" { print $NF }')"
            test -n "$alignments"
            while read -r alignment; do
              test "$((alignment))" -ge 16384
            done <<< "$alignments"

            {
              printf '\nAndroid ELF checks for %s\n%s\n' "$target" "$machine"
              (cd "$package" && sha256sum "android-arm64-v8a/$target")
              printf 'Android shared library dependencies\n%s\n' "$dependencies"
              printf 'OpenCL symbol imports\n%s\n' "$opencl_imports"
              printf 'Android PT_LOAD alignments\n%s\n' "$alignments"
              printf 'listen_import=absent\nruntime_library_path=absent\n'
            } >> "$manifest"
          done

          {
            printf '\nLoader CMake cache\n'
            cat "$opencl_stage/build/CMakeCache.txt"
            printf '\nRuntime CMake cache\n'
            cat "$cache"
          } >> "$manifest"
          install -Dm644 "$manifest" "$package/BUILD.txt"

          for source in CMakeLists.txt qwen_backend_probe.cpp README.md; do
            install -Dm644 "$qa_source/$source" "$package/source/runtime_qa/$source"
          done
          install -Dm644 /usr/share/common-licenses/Apache-2.0 "$package/licenses/runtime_qa/Apache-2.0"
          install -Dm644 "$qa_source/README.md" "$package/licenses/runtime_qa/README.md"
          install -Dm644 llama.cpp/LICENSE "$package/licenses/llama.cpp/LICENSE"
          install -Dm644 "$ndk/NOTICE" "$package/licenses/android-ndk/NOTICE"
          install -Dm644 opencl-headers/LICENSE "$package/licenses/opencl-headers/LICENSE"
          install -Dm644 opencl-icd-loader/LICENSE "$package/licenses/opencl-icd-loader/LICENSE"
          license_list="$diagnostics/llama-license-paths.txt"
          find llama.cpp/vendor llama.cpp/ggml llama.cpp/licenses -type f \
            \( -iname 'license*' -o -iname 'copying*' -o -iname 'notice*' \) -print0 > "$license_list"
          test -s "$license_list"
          while IFS= read -r -d '' license; do
            install -Dm644 "$license" "$package/licenses/$license"
          done < "$license_list"

          if [[ -n "$(find "$package" -iname '*.so' -o -iname '*.so.*')" ]]; then
            printf 'Unexpected shared library in runtime package\n' >&2
            exit 1
          fi
          (
            cd "$package"
            find . -type f ! -path './SHA256SUMS' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          tar -czf "$RUNNER_TEMP/sign-qwen-opencl-smoke.tar.gz" -C "$package" .

      - name: Upload the Android OpenCL QA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/sign-qwen-opencl-smoke.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload OpenCL build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sign-qwen-opencl-build-diagnostics
          path: ${{ runner.temp }}/sign-qwen-opencl-diagnostics/
          if-no-files-found: warn
          retention-days: 7
