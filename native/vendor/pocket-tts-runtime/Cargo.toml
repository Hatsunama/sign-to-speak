[package]
name = "sign-pocket-tts-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 AND MIT"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
anyhow = "=1.0.104"
half = "=2.7.1"
ptts = { git = "https://github.com/gabrieldemarmiesse/xn-ptts", rev = "7efa26973f81bba42cf2ace8da2c1eb9b605d54d", default-features = false }
rand = { version = "=0.9.5", default-features = false, features = ["std", "std_rng"] }
rand_distr = "=0.5.1"
sentencepiece = { version = "=0.14.0", features = ["static"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
xn = "=0.2.12"

[profile.release]
codegen-units = 1
lto = "thin"
