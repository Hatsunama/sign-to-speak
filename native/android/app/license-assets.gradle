// Curate notices for code still in the APK. Historical Flite receipts remain
// in source control for provenance, but are no longer bundled.
def licenseRoot = file("../../licenses")
def licenseFiles = ["sign-to-speak/LICENSE", "sign-to-speak/NOTICE", "react-native-template-MIT.txt"]
licenseFiles.each { relative ->
    def source = new File(licenseRoot, relative)
    if (!source.isFile() || source.length() == 0) {
        throw new GradleException("Required nonempty license asset missing: ${source}")
    }
}
def reviewedLicenseAssets = layout.buildDirectory.dir("generated/reviewed-license-assets")
def stageReviewedLicenses = tasks.register("stageReviewedLicenses", Copy) {
    from(licenseRoot) { include(licenseFiles) }
    into(reviewedLicenseAssets)
    includeEmptyDirs = false
}
android.sourceSets.main.assets.srcDir(reviewedLicenseAssets)
tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
    dependsOn(stageReviewedLicenses)
}
