// Curate notices for code still in the APK. Historical Flite receipts remain
// in source control for provenance, but are no longer bundled.
abstract class StageReviewedLicenses extends DefaultTask {
    @Internal
    abstract org.gradle.api.file.DirectoryProperty getSourceRoot()

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract org.gradle.api.file.ConfigurableFileCollection getSelectedFiles()

    @Input
    abstract org.gradle.api.provider.ListProperty<String> getIncludedPaths()

    @OutputDirectory
    abstract org.gradle.api.file.DirectoryProperty getOutputDirectory()

    @javax.inject.Inject
    abstract org.gradle.api.file.FileSystemOperations getFileSystemOperations()

    @TaskAction
    void stage() {
        def root = sourceRoot.get().asFile
        def included = includedPaths.get()
        def destination = outputDirectory.get().asFile
        fileSystemOperations.sync {
            from(root) { include(included) }
            into(destination)
            includeEmptyDirs = false
        }
    }
}

def licenseRoot = file("../../licenses")
def licenseFiles = ["sign-to-speak/LICENSE", "sign-to-speak/NOTICE", "react-native-template-MIT.txt"]
licenseFiles.each { relative ->
    def source = new File(licenseRoot, relative)
    if (!source.isFile() || source.length() == 0) {
        throw new GradleException("Required nonempty license asset missing: ${source}")
    }
}
androidComponents {
    onVariants(selector().all()) { variant ->
        def stageReviewedLicenses = tasks.register("stage${variant.name.capitalize()}ReviewedLicenses", StageReviewedLicenses) {
            sourceRoot.fileValue(licenseRoot)
            selectedFiles.from(project.fileTree(licenseRoot) { include(licenseFiles) })
            includedPaths.set(licenseFiles)
            outputDirectory.set(layout.buildDirectory.dir("generated/reviewed-license-assets/${variant.name}"))
        }
        variant.sources.assets.addGeneratedSourceDirectory(stageReviewedLicenses) { it.outputDirectory }
    }
}
