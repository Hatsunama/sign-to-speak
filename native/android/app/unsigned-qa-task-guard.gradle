// Shared predicate for both opt-in unsigned QA task graphs. Keep the lint.jar
// exception tied to this one task path and the two reviewed AGP 8.12 types.
def forbiddenUnsignedQaTask = { String path, String name, String type ->
    def n = name.toLowerCase()
    def localLintJar = path == ":react-native-safe-area-context:prepareLintJarForPublish" &&
            type in ["com.android.build.gradle.internal.tasks.PrepareLintJarForPublish",
                "com.android.build.gradle.internal.tasks.PrepareLintJarForPublish_Decorated"]
    n.contains("validatesigning") || n.contains("keystore") || n.contains("keytool") ||
            n ==~ /.*(create|generate).*key.*/ || n.startsWith("sign") ||
            n.startsWith("install") || n.startsWith("uninstall") || n.startsWith("connected") ||
            (n.contains("publish") && !localLintJar) || n.contains("upload") ||
            n in ["assemblerelease", "bundlerelease"] ||
            type.contains("ValidateSigningTask") ||
            type.contains("PublishToMaven") || type.contains("PublishToIvyRepository")
}

// Exercise the compiled predicate with representative graph records in either
// opt-in QA gate, including both exact lint.jar classes and near misses.
def verifyUnsignedQaTaskFixtures = {
    def ordinaryType = "org.gradle.api.DefaultTask"
    def lintType = "com.android.build.gradle.internal.tasks.PrepareLintJarForPublish"
    def lintPath = ":react-native-safe-area-context:prepareLintJarForPublish"
    def allowed = [
        [":app:assembleQa", ordinaryType],
        [":app:writeQaSigningConfigVersions", ordinaryType],
        [lintPath, lintType],
        [lintPath, lintType + "_Decorated"],
    ]
    def denied = [
        [lintPath, ordinaryType],
        [":other:prepareLintJarForPublish", lintType],
        [":app:signQa", ordinaryType],
        [":app:installQa", ordinaryType],
        [":app:uninstallQa", ordinaryType],
        [":app:connectedQaAndroidTest", ordinaryType],
        [":app:validateSigningQa", ordinaryType],
        [":app:checkKeystore", ordinaryType],
        [":app:runKeytool", ordinaryType],
        [":app:createQaKey", ordinaryType],
        [":app:generateQaKey", ordinaryType],
        [":app:publishQa", ordinaryType],
        [":app:uploadQa", ordinaryType],
        [":app:assembleRelease", ordinaryType],
        [":app:bundleRelease", ordinaryType],
        [":app:harmless", "com.android.build.gradle.internal.tasks.ValidateSigningTask"],
        [":app:harmless", "org.gradle.api.publish.maven.tasks.PublishToMavenRepository"],
        [":app:harmless", "org.gradle.api.publish.ivy.tasks.PublishToIvyRepository"],
    ]
    def matches = { record ->
        def path = record[0]
        forbiddenUnsignedQaTask(path, path.tokenize(":").last(), record[1])
    }
    allowed.each { record ->
        if (matches(record)) throw new GradleException("Unsigned QA task policy rejected allowed fixture: ${record}")
    }
    denied.each { record ->
        if (!matches(record)) throw new GradleException("Unsigned QA task policy accepted forbidden fixture: ${record}")
    }
}

ext.forbiddenUnsignedQaTask = forbiddenUnsignedQaTask
ext.verifyUnsignedQaTaskFixtures = verifyUnsignedQaTaskFixtures