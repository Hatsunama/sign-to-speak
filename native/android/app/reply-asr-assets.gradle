import java.security.MessageDigest

// reply-asr-component.py prepares this directory on the hosted builder. The app
// consumes only local files; neither Gradle nor the Android runtime downloads a model.
def replyStage = file("../../generated/reply-asr-component")
def replyAssets = new File(replyStage, "assets")
def replyNotices = new File(replyStage, "notices")
android.sourceSets.main.assets.srcDir(replyAssets)
android {
    androidResources {
        // AssetManager.openFd requires stored model entries, not deflated ZIP entries.
        noCompress "bin"
    }
}

